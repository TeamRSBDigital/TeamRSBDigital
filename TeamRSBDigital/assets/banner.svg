<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Dark Gray to Black Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1D" />
      <stop offset="50%" stop-color="#111111" />
      <stop offset="100%" stop-color="#0F0F0F" />
    </linearGradient>

    <!-- Deep Red Gradient for Accents -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&amp;display=swap');
      .title {
        font-family: 'Inter', sans-serif;
        font-weight: 900;
        font-size: 72px;
        fill: #FFFFFF;
        letter-spacing: -2px;
      }
      .subtitle {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 28px;
        fill: #A0A0A0;
        letter-spacing: 0.5px;
      }
      .tag {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 16px;
        fill: #FFFFFF;
      }
      .bracket {
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        font-size: 90px;
        fill: #E53935;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGradient)" rx="12" ry="12" />

  <!-- Abstract Background Elements -->
  <circle cx="1000" cy="50" r="150" fill="url(#redGradient)" opacity="0.05" />
  <circle cx="200" cy="300" r="250" fill="#FFFFFF" opacity="0.02" />
  <rect x="0" y="340" width="1200" height="10" fill="url(#redGradient)" rx="4" />

  <!-- Content Container -->
  <g transform="translate(100, 80)">
    
    <!-- Code Bracket Design Accent -->
    <text x="-40" y="110" class="bracket" opacity="0.4">&lt;</text>
    <text x="590" y="110" class="bracket" opacity="0.4">/&gt;</text>

    <!-- Main Typography -->
    <text x="0" y="80" class="title">RAYHAN BISWAS</text>
    
    <!-- Subtitle with Red Dot Separator -->
    <text x="2" y="135" class="subtitle">Full Stack Developer</text>
    <circle cx="295" cy="127" r="5" fill="url(#redGradient)" filter="url(#glow)" />
    <text x="315" y="135" class="subtitle">AI Automation Engineer</text>
    
    <!-- Badges / Tags row -->
    <g transform="translate(2, 175)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="165" height="36" rx="6" fill="#1E1E1E" stroke="#333" stroke-width="1" />
      <text x="18" y="23" class="tag">Next.js &amp; React</text>
      
      <!-- Tag 2 -->
      <rect x="180" y="0" width="170" height="36" rx="6" fill="#1E1E1E" stroke="#333" stroke-width="1" />
      <circle cx="195" cy="18" r="4" fill="#E53935" />
      <text x="208" y="23" class="tag">AI Integration</text>

      <!-- Tag 3 -->
      <rect x="365" y="0" width="245" height="36" rx="6" fill="#1E1E1E" stroke="#333" stroke-width="1" />
      <text x="382" y="23" class="tag">Digital Marketing &amp; Analytics</text>

      <!-- Tag 4 -->
      <rect x="625" y="0" width="195" height="36" rx="6" fill="url(#redGradient)" />
      <text x="643" y="23" class="tag">TeamRSBDigital</text>
    </g>
  </g>

  <!-- Decorative Lines -->
  <path d="M 950 150 L 1050 150 M 1000 100 L 1000 200" stroke="#333333" stroke-width="2" stroke-dasharray="4,4" opacity="0.3" />
  <path d="M 1080 80 L 1120 120 M 1080 120 L 1120 80" stroke="#E53935" stroke-width="3" opacity="0.6" filter="url(#glow)" />
  <circle cx="1100" cy="220" r="3" fill="#FFFFFF" opacity="0.5" />
  <circle cx="1060" cy="250" r="5" fill="#E53935" opacity="0.8" />
  
</svg>
